name: probe
on:
  push:
    branches: [probe-spells]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir -p probe18
          cat > /tmp/p.mjs <<'JS'
          import fs from 'fs'
          const out = {}
          const UA = { 'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36', 'accept-language': 'en-US,en;q=0.9' }
          async function get(url, opts = {}) { try { const r = await fetch(url, { headers: UA, ...opts }); const t = await r.text(); return { status: r.status, len: t.length, text: t } } catch (e) { return { status: 'err ' + e.message, len: 0, text: '' } } }
          const search = await get('https://www.youtube.com/results?search_query=albion+online+build+guide')
          const vids = [...new Set([...search.text.matchAll(/"videoId":"([\w-]{11})"/g)].map((m) => m[1]))].slice(0, 5)
          const chans = [...new Set([...search.text.matchAll(/"browseId":"(UC[\w-]{22})"/g)].map((m) => m[1]))].slice(0, 5)
          out.search = { status: search.status, len: search.len, vids, chans, consent: /consent|confirm you.re not a bot/i.test(search.text) }
          if (chans[0]) { const rss = await get(`https://www.youtube.com/feeds/videos.xml?channel_id=${chans[0]}`); out.rss = { status: rss.status, entries: (rss.text.match(/<entry>/g) || []).length, titles: [...rss.text.matchAll(/<media:title>([^<]*)/g)].slice(0, 3).map((m) => m[1]), descSample: (rss.text.match(/<media:description>([^<]{0,300})/) || [])[1] } }
          const api = await get('https://www.googleapis.com/youtube/v3/search?part=snippet&q=albion')
          out.dataApiNoKey = { status: api.status, body: api.text.slice(0, 200) }
          out.videos = []
          for (const v of vids.slice(0, 3)) {
            const page = await get(`https://www.youtube.com/watch?v=${v}`)
            const title = (page.text.match(/<title>([^<]*)/) || [])[1]
            const bot = /confirm you.re not a bot|LOGIN_REQUIRED/i.test(page.text)
            const tracks = [...page.text.matchAll(/"baseUrl":"(https:\/\/www\.youtube\.com\/api\/timedtext[^"]*)"/g)].map((m) => JSON.parse('"' + m[1] + '"'))
            const desc = (page.text.match(/"shortDescription":"((?:[^"\\]|\\.){0,400})/) || [])[1]
            let caption = null
            if (tracks[0]) { const c = await get(tracks[0]); caption = { status: c.status, len: c.len, sample: c.text.slice(0, 300) } }
            out.videos.push({ v, status: page.status, len: page.len, title, bot, tracks: tracks.length, desc, caption })
          }
          fs.writeFileSync('probe18.json', JSON.stringify(out, null, 1))
          JS
          node /tmp/p.mjs > probe18/log.txt 2>&1 || true
          git config user.name probe; git config user.email probe@x
          mv probe18.json probe18/out.json;  git add probe18; git commit -m "probe18 output"; git push
