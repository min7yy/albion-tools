name: Price snapshot

# Run by hand: saves real prices and sale history for one server to the snapshots branch, so the
# Build guide can be tested against real data.
on:
  workflow_dispatch:
    inputs:
      server:
        description: Server
        default: asia
        type: choice
        options: [asia, europe, americas]

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch prices
        run: node --experimental-strip-types scripts/snapshot-prices.ts ${{ inputs.server }} snapshot-out
      - name: Publish to the snapshots branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd snapshot-out
          git init -q -b snapshots
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm "Price snapshot $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" snapshots
