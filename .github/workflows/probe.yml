name: probe
on:
  push:
    branches: [probe-spells]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir -p probe9
          cat > /tmp/p.mjs <<'JS'
          const out = []
          let lastV = '', lastId = ''
          for (let page = 0; page < 60; page++) {
            const r = await fetch(`https://api.albionfreemarket.com/be/builds?limit=200&sortBy=upvotes&cursorLastValue=${lastV}&cursorLastId=${lastId}`)
            const j = await r.json()
            for (const b of j.builds) out.push([b.weaponItemGroup, b.authorName, b.upvotesCount, b.downvotesCount, b.netVotes, b.createdAt?.slice(0,10), b.updatedAt?.slice(0,10), b.youtubeViews ?? 0,
              (b.slots ?? []).filter(s => s.slotType === 'mainhand').flatMap(s => (s.mainItemSelection?.selectedSpells ?? []).map(x => x.uniqueName)).join(' ')])
            if (!j.nextCursor || !j.builds.length) break
            lastV = encodeURIComponent(String(j.nextCursor.lastValue)); lastId = encodeURIComponent(j.nextCursor.lastId)
            await new Promise((r) => setTimeout(r, 1500))
          }
          console.log(JSON.stringify(out))
          JS
          node /tmp/p.mjs > probe9/builds.json 2> probe9/log.txt || true
          git config user.name probe; git config user.email probe@x
          git add probe9; git commit -m "probe9 output"; git push
