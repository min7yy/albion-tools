name: Price archive

# The Data Project only keeps each sell order for a day or so. This saves every weapon and gear
# sell order it sees to the price-archive branch, keeping the last one per item, city and quality
# for a week, so the Build guide can fall back on it (marked with its age).
on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load the previous archive
        run: |
          mkdir -p archive-out
          if git fetch --depth=1 origin price-archive; then
            git archive FETCH_HEAD | tar -x -C archive-out
          fi
      - name: Add current prices
        run: node --experimental-strip-types scripts/archive-prices.ts archive-out asia europe americas
      - name: Publish to the price-archive branch
        # One commit, force-pushed each run, so the branch never builds up history.
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd archive-out
          git init -q -b price-archive
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm "Price archive $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" price-archive
