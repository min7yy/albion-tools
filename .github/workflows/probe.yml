name: probe
on:
  push:
    branches: [probe-spells]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe5; cd probe5
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          curl -sL -A "$UA" -m 30 https://albionfreemarket.com/chunk-DFSgxv5S.js | grep -oE '.{0,300}(getTopBuilds|getBuild|searchBuilds).{0,1500}' > ctx.txt || true
          B=https://api.albionfreemarket.com/be
          for u in "builds/top" "builds/top?page=1" "builds/top?pageSize=50&page=1" "builds/search?query=bow"; do
            f=$(echo "$u" | tr '/?&=' '____'); curl -sL -A "$UA" -H "Origin: https://albionfreemarket.com" -m 30 -o "$f.json" -w "$u %{http_code} %{content_type} %{size_download}\n" "$B/$u" >> index.txt || true
          done
          cd ..; git config user.name probe; git config user.email probe@x
          git add probe5; git commit -m "probe5 output"; git push
