name: probe
on:
  push:
    branches: [probe-spells]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir -p probe10; cd probe10
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36'
          curl -sSL -A "$UA" -D home.hdr https://killboard-1.com/ -o home.html || true
          for p in robots.txt sitemap.xml api api/ ; do curl -sSL -A "$UA" -o "$(echo $p | tr / _).out" -w "$p %{http_code}\n" "https://killboard-1.com/$p" >> codes.txt || true; done
          grep -oE '(src|href)="[^"]+\.js[^"]*"' home.html | sed -E 's/.*="([^"]+)"/\1/' | head -20 > scripts.txt || true
          i=0; while read s; do i=$((i+1)); case "$s" in http*) u="$s";; //*) u="https:$s";; /*) u="https://killboard-1.com$s";; *) u="https://killboard-1.com/$s";; esac; curl -sSL -A "$UA" "$u" -o js$i.js; echo "$u" >> fetched.txt; done < scripts.txt
          cat js*.js 2>/dev/null | grep -oE '"(/api|https?://[a-zA-Z0-9.-]+)[^"]{0,120}"' | sort -u | head -300 > urls.txt || true
          cat js*.js home.html 2>/dev/null | grep -oiE '.{0,80}(spell|ability|skill).{0,80}' | head -60 > spells.txt || true
          rm -f js*.js
          cd ..; git config user.name probe; git config user.email probe@x
          git add probe10; git commit -m "probe10 output"; git push
