name: probe
on:
  push:
    branches: [probe-spells]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          curl -s "https://gameinfo-sgp.albiononline.com/api/gameinfo/events?limit=10&offset=0" -o probe/asia.json
          curl -s "https://gameinfo.albiononline.com/api/gameinfo/events?limit=10&offset=0" -o probe/am.json
          ID=$(python3 -c "import json;print(json.load(open('probe/am.json'))[0]['EventId'])")
          curl -s "https://gameinfo.albiononline.com/api/gameinfo/events/$ID" -o probe/one.json
          git config user.name probe; git config user.email probe@x
          git add probe; git commit -m "probe output"; git push
