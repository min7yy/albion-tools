name: probe
on:
  push:
    branches: [probe-spells]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir -p probe8
          COLLECT_MINUTES=3 node --experimental-strip-types scripts/collect-meta.ts probe8 > probe8/log.txt 2>&1 || true
          rm -f probe8/*-state.json
          git config user.name probe; git config user.email probe@x
          git add probe8; git commit -m "probe8 output"; git push
