name: Collect kill meta

# Polls recent kills from the official API nonstop and publishes a rolling week of weapon use,
# gear pairings and whole loadouts (by fight size and item power) to the meta-data branch, which
# the site reads. Each run collects for 50 minutes, publishes, then starts the next run itself;
# the schedule only restarts the chain if a run fails (GitHub runs scheduled jobs late or not at all).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: meta
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load the previous run's data
        run: |
          mkdir -p meta-out
          if git fetch --depth=1 origin meta-data; then
            git archive FETCH_HEAD | tar -x -C meta-out
          fi
      - name: Collect kills
        env:
          COLLECT_MINUTES: 50
        run: node --experimental-strip-types scripts/collect-meta.ts meta-out
      - name: Publish to the meta-data branch
        # One commit, force-pushed each run, so the branch never builds up history.
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd meta-out
          git init -q -b meta-data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm "Kill meta $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" meta-data
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run meta.yml --ref "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"
