name: probe
on:
  push:
    branches: [probe-spells]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe2; cd probe2
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          for u in builds builds/browse api/builds api/v1/builds api/builds/search build-list sitemap.xml robots.txt; do
            f=$(echo $u | tr '/' '_'); curl -sL -A "$UA" -m 30 -o "$f.out" -w "$u %{http_code} %{content_type} %{size_download}\n" "https://albionfreemarket.com/$u" >> index.txt || true
          done
          curl -sL -A "$UA" -m 30 -o metabattle.html -w "metabattle %{http_code} %{size_download}\n" "https://metabattle.com/wiki/Albion_Online" >> index.txt || true
          curl -s -m 30 -o spellicon.png -w "spellicon %{http_code} %{content_type} %{size_download}\n" "https://render.albiononline.com/v1/spell/DEADLYSHOT.png" >> index.txt || true
          cd ..; git config user.name probe; git config user.email probe@x
          git add probe2; git commit -m "probe2 output"; git push
