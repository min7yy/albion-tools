name: probe
on:
  push:
    branches: [probe-spells]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir -p probe17
          cat > /tmp/p.mjs <<'JS'
          import fs from 'fs'
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
          const servers = { europe: 'https://gameinfo-ams.albiononline.com', americas: 'https://gameinfo.albiononline.com', asia: 'https://gameinfo-sgp.albiononline.com' }
          async function page(base, o) { for (let a = 0; a < 3; a++) { try { const r = await fetch(`${base}/api/gameinfo/events?limit=51&offset=${o}`); if (r.ok) return await r.json(); if (r.status < 500) return [] } catch {} await sleep(2000) } return [] }
          const st = {}
          for (const k of Object.keys(servers)) st[k] = { lastSeen: 0, cutoffCount: 0, cutoffPasses: 0, seen: new Set(), firstIds: null, fullCount: 0, pagesOld: 0, pagesFull: 0, newPerPage: Array(21).fill(0) }
          const until = Date.now() + 15 * 60 * 1000
          let pass = 0
          while (Date.now() < until) {
            for (const [k, base] of Object.entries(servers)) {
              const s = st[k]
              const pages = []
              for (let o = 0; o <= 1000; o += 51) { const p = await page(base, o); if (!p.length) break; pages.push(p); await sleep(250) }
              if (pass === 0) { for (const p of pages) for (const e of p) s.seen.add(e.EventId); s.lastSeen = Math.max(...pages.flat().map((e) => e.EventId)); continue }
              // Old algorithm: page until a page holds an id <= lastSeen, count ids > lastSeen.
              const last = s.lastSeen; const pass1 = new Set()
              for (const p of pages) { s.pagesOld++; for (const e of p) if (e.EventId > last && !pass1.has(e.EventId)) { pass1.add(e.EventId); s.cutoffCount++; s.lastSeen = Math.max(s.lastSeen, e.EventId) } if (p.some((e) => e.EventId <= last)) break }
              // Set algorithm over every page.
              pages.forEach((p, i) => { s.pagesFull++; for (const e of p) if (!s.seen.has(e.EventId)) { s.seen.add(e.EventId); s.fullCount++; s.newPerPage[i]++ } })
            }
            pass++
            await sleep(20000)
          }
          const out = {}
          for (const [k, s] of Object.entries(st)) out[k] = { passes: pass, oldAlgorithm: s.cutoffCount, setAlgorithm: s.fullCount, missedShare: 1 - s.cutoffCount / s.fullCount, newPerPage: s.newPerPage }
          fs.writeFileSync('probe17.json', JSON.stringify(out, null, 1))
          JS
          node /tmp/p.mjs > probe17/log.txt 2>&1 || true
          git config user.name probe; git config user.email probe@x
          mv probe17.json probe17/out.json;  git add probe17; git commit -m "probe17 output"; git push
