name: probe
on:
  push:
    branches: [probe-spells]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe3; cd probe3
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          curl -sL -A "$UA" -m 60 -o main.js https://albionfreemarket.com/main-XTAVSGFE.js
          grep -oE '"[^"]{0,60}(api|build)[^"]{0,80}"' main.js | sort -u | head -400 > strings.txt || true
          curl -sL -A "$UA" -m 60 -o top.html "https://albionfreemarket.com/builds/top"
          for c in $(grep -oE 'chunk-[A-Z0-9]+\.js' main.js | sort -u); do curl -sL -A "$UA" -m 30 -o $c https://albionfreemarket.com/$c; done
          cat chunk-*.js 2>/dev/null | grep -oE '"[^"]{0,60}(api|/build)[^"]{0,80}"' | sort -u | head -400 > chunkstrings.txt || true
          rm -f chunk-*.js
          cd ..; git config user.name probe; git config user.email probe@x
          git add probe3; git commit -m "probe3 output"; git push
