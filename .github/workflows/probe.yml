name: probe
on:
  push:
    branches: [probe-spells]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir -p probe15
          cat > /tmp/p.mjs <<'JS'
          import fs from 'fs'
          const out = []
          let cursor = null
          for (let page = 0; page < 60; page++) {
            const params = new URLSearchParams({ limit: '200', sortBy: 'upvotes' })
            if (cursor) { params.set('cursorLastValue', String(cursor.lastValue)); params.set('cursorLastId', cursor.lastId) }
            const j = await (await fetch('https://api.albionfreemarket.com/be/builds?' + params)).json()
            for (const b of j.builds) if ((b.netVotes ?? 0) >= 1 && b.updatedAt >= '2025-10-08') out.push(b)
            cursor = j.nextCursor
            if (!cursor || j.builds.length < 200) break
            await new Promise((r) => setTimeout(r, 1500))
          }
          fs.writeFileSync('probe15.json', JSON.stringify(out))
          JS
          node /tmp/p.mjs > probe15/log.txt 2>&1 || true
          git config user.name probe; git config user.email probe@x
          mv probe15.json probe15/out.json; git add probe15; git commit -m "probe15 output"; git push
