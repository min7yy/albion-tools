name: probe
on:
  push:
    branches: [probe-spells]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe4 /tmp/c; cd /tmp/c
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          curl -sL -A "$UA" -m 60 -o main.js https://albionfreemarket.com/main-XTAVSGFE.js
          for c in $(grep -oE 'chunk-[A-Za-z0-9_-]+\.js' main.js | sort -u); do curl -sL -A "$UA" -m 30 -o $c https://albionfreemarket.com/$c; done
          for f in *.js; do grep -oE '.{0,160}(afmApis|baseUrl|/builds|buildsApi|BuildsApi|votes).{0,200}' $f | sed "s/^/$f: /"; done > $GITHUB_WORKSPACE/probe4/apis.txt || true
          grep -l 'afmApis' *.js > $GITHUB_WORKSPACE/probe4/files.txt || true
          grep -ohE 'https://[a-zA-Z0-9.-]+[a-zA-Z0-9/._-]*' *.js | sort | uniq -c | sort -rn | head -80 > $GITHUB_WORKSPACE/probe4/urls.txt
          cd $GITHUB_WORKSPACE
          git config user.name probe; git config user.email probe@x
          git add probe4; git commit -m "probe4 output"; git push
