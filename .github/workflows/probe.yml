name: probe
on:
  push:
    branches: [probe-spells]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir -p probe7
          node --experimental-strip-types scripts/collect-community.ts probe7 > probe7/log.txt 2>&1 || true
          git config user.name probe; git config user.email probe@x
          git add probe7; git commit -m "probe7 output"; git push
