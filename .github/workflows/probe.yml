name: probe
on:
  push:
    branches: [probe-spells]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir -p probe11; cd probe11
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36'
          for u in https://albionoracle.com/en/meta https://albionoracle.com/en/killboard https://www.albiondatabase.com/ https://www.albionkit.com/tools/killboard https://murderledger.albiononline2d.com/ https://albionbattlehub.com/en https://albionslayerboard.com/ https://www.albionkillboard.space/ https://albiononline2d.com/en/builds; do
            n=$(echo "$u" | sed -E 's#https?://##; s#[^a-zA-Z0-9]+#_#g')
            code=$(curl -sSL -m 30 -A "$UA" -o "$n.html" -w '%{http_code}' "$u" || echo ERR)
            echo "$u $code $(wc -c < $n.html)" >> codes.txt
            { echo "== $u"; grep -oE '(src)="[^"]+\.js[^"]*"' "$n.html" | head -15; } >> scripts.txt
            for s in $(grep -oE 'src="[^"]+\.js[^"]*"' "$n.html" | sed -E 's/src="([^"]+)"/\1/' | head -15); do
              case "$s" in http*) j="$s";; //*) j="https:$s";; /*) j="$(echo $u | grep -oE 'https?://[^/]+')$s";; *) j="$(echo $u | grep -oE 'https?://[^/]+')/$s";; esac
              curl -sSL -m 30 -A "$UA" "$j" >> "$n.js" || true
            done
            { echo "== $u"; cat "$n.html" "$n.js" 2>/dev/null | grep -oE '["'"'"'`](https?://[a-zA-Z0-9.-]+)?/api[a-zA-Z0-9/_.?=&${}-]{0,100}' | sort -u | head -60; } >> apis.txt
            { echo "== $u"; cat "$n.html" "$n.js" 2>/dev/null | grep -oiE '.{0,60}(spells?|abilities|skills?)["'"'"']?\s*[:=].{0,60}' | sort -u | head -20; } >> spells.txt
            rm -f "$n.js"; head -c 4000 "$n.html" > "$n.head"; rm -f "$n.html"
          done
          cd ..; git config user.name probe; git config user.email probe@x
          git add probe11; git commit -m "probe11 output"; git push
