name: probe
on:
  push:
    branches: [probe-spells]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir -p probe14
          cat > /tmp/p.mjs <<'JS'
          import fs from 'fs'
          const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36'
          const get = async (u) => { try { const r = await fetch(u, { headers: { 'user-agent': UA }, signal: AbortSignal.timeout(30000) }); return [r.status, await r.text()] } catch (e) { return ['ERR ' + e.message, ''] } }
          const out = {}
          const A = 'https://api.albionslayerboard.com'
          const [, juicy] = await get(A + '/duels/juicy?region=EU&limit=5&minTotalValue=500000&sinceDays=7')
          out.juicy = juicy.slice(0, 3000)
          const ids = [...new Set([...juicy.matchAll(/"(?:eventId|EventId|id)"\s*:\s*"?(\d{6,})/g)].map((m) => m[1]))].slice(0, 3)
          out.ids = ids
          for (const id of ids) {
            const [st, raw] = await get(A + '/events/' + id + '/raw?plain=1')
            out['raw ' + id] = [st, raw.slice(0, 200)]
            const sp = [...raw.matchAll(/"(ActiveSpells|PassiveSpells)"\s*:\s*(\[[^\]]*\])/g)].map((m) => m[1] + '=' + m[2].slice(0, 200))
            out['rawSpells ' + id] = sp
            const [st2, off] = await get('https://gameinfo-ams.albiononline.com/api/gameinfo/events/' + id)
            out['official ' + id] = [st2, [...off.matchAll(/"(ActiveSpells|PassiveSpells)"\s*:\s*(\[[^\]]*\])/g)].map((m) => m[1] + '=' + m[2].slice(0, 200)), off.slice(0, 300)]
          }
          const [, lbm] = await get(A + '/cd/leaderboard/meta?region=EU&tier=slayer&ids=')
          out.lbmeta = lbm.slice(0, 1500)
          fs.writeFileSync('probe14.json', JSON.stringify(out, null, 1))
          JS
          node /tmp/p.mjs > probe14/log.txt 2>&1 || true
          git config user.name probe; git config user.email probe@x
          mv probe14.json probe14/out.json; git add probe14; git commit -m "probe14 output"; git push
